name: Build Windows Desktop Installer

on:
  workflow_dispatch:

jobs:
  build_bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Build desktop JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop:bundle

      - name: Upload JS bundle
        uses: actions/upload-artifact@v4
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron

  build_linux_cli:
    needs: build_bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install patchelf
        run: command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf; }

      - name: Download JS bundle
        uses: actions/download-artifact@v4
        with:
          name: js-bundle
          path: apps

      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Stage resource monitor for the CLI archive
        run: |
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp "native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor" "$RUNNER_TEMP/cli-resource-monitor/linux-x64/t3-resource-monitor"

      - name: Build Linux CLI executable
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build Linux CLI archive for WSL
        run: |
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version 0.1.12 \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Upload Linux CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: cli-linux-x64
          path: release-cli/*

  build_windows:
    needs: [build_bundle, build_linux_cli]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: cargo-xwin@0.23.1

      - name: Build resource monitor
        shell: bash
        run: cargo xwin build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Download JS bundle
        uses: actions/download-artifact@v4
        with:
          name: js-bundle
          path: apps

      - name: Download Linux CLI archive for WSL
        uses: actions/download-artifact@v4
        with:
          name: cli-linux-x64
          path: wsl-runtime

      - name: Build Windows desktop installer
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
        run: |
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version 0.1.12 \
            --skip-build \
            --verbose \
            --wsl-runtime "$GITHUB_WORKSPACE"/wsl-runtime/t3-*-linux-x64.tar.gz

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: t3code-windows-x64
          path: release/*.exe
